name: Test Reference Implementation

on:
  pull_request:
    paths:
      - "code/taskboard/**"
      - ".github/workflows/04-test-reference-implementation.yml"
  push:
    branches: [main]
    paths:
      - "code/taskboard/**"
      - ".github/workflows/04-test-reference-implementation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskboard-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TASKBOARD_DIR: code/taskboard
  NODE_VERSION: "24.19.0"
  JAVA_VERSION: "21"

jobs:
  build-and-test:
    name: Build, test and smoke test TaskBoard
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate reference structure
        run: python3 "$TASKBOARD_DIR/validate_reference.py"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: ${{ env.TASKBOARD_DIR }}/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: code/taskboard/backend/pom.xml

      - name: Compile and test backend
        working-directory: ${{ env.TASKBOARD_DIR }}/backend
        run: mvn -B --no-transfer-progress verify

      - name: Validate Docker Compose configuration
        working-directory: ${{ env.TASKBOARD_DIR }}
        run: docker compose config --quiet

      - name: Build Docker images
        working-directory: ${{ env.TASKBOARD_DIR }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker compose build; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Docker build failed after $attempt attempts."
              exit 1
            fi
            echo "Docker build attempt $attempt failed; retrying in 15 seconds..."
            sleep 15
          done

      - name: Start complete service
        working-directory: ${{ env.TASKBOARD_DIR }}
        env:
          TASKBOARD_PORT: "18080"
        run: |
          set -euo pipefail
          if ! docker compose up -d --wait --wait-timeout 120; then
            echo "Service startup failed. Container status:"
            docker compose ps -a || true
            echo "Container logs:"
            docker compose logs --no-color || true
            exit 1
          fi

      - name: Smoke test complete request path
        env:
          TASKBOARD_URL: http://localhost:18080
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ["TASKBOARD_URL"]

          with urllib.request.urlopen(base + "/healthz", timeout=10) as response:
              assert response.status == 200
              assert response.read().decode().strip() == "ok"

          with urllib.request.urlopen(base + "/", timeout=10) as response:
              assert response.status == 200
              html = response.read().decode()
              assert "TaskBoard" in html

          payload = json.dumps({
              "title": "GitHub Actions smoke test",
              "description": "Created through Nginx, Quarkus and PostgreSQL",
              "status": "OPEN",
              "priority": "NORMAL",
              "dueDate": None,
          }).encode()
          request = urllib.request.Request(
              base + "/api/tasks",
              data=payload,
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              assert response.status == 201
              created = json.load(response)
              task_id = created["id"]
              assert created["title"] == "GitHub Actions smoke test"

          with urllib.request.urlopen(base + "/api/tasks/" + task_id, timeout=10) as response:
              assert response.status == 200
              fetched = json.load(response)
              assert fetched["id"] == task_id
              assert fetched["priority"] == "NORMAL"

          with urllib.request.urlopen(base + "/api/tasks", timeout=10) as response:
              assert response.status == 200
              tasks = json.load(response)
              assert any(task["id"] == task_id for task in tasks)

          print("OK: full TaskBoard request path verified")
          PY

      - name: Show container status and logs on failure
        if: failure()
        working-directory: ${{ env.TASKBOARD_DIR }}
        env:
          TASKBOARD_PORT: "18080"
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Stop complete service
        if: always()
        working-directory: ${{ env.TASKBOARD_DIR }}
        env:
          TASKBOARD_PORT: "18080"
        run: docker compose down -v --remove-orphans
